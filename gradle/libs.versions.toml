[versions]
# 构建工具
kotlin           = "2.1.21"
ksp              = "2.1.21-2.0.2"
agp              = "8.10.1"

# AndroidX 核心
core-ktx         = "1.17.0"
activity-compose = "1.10.1"

# Compose BOM
compose-bom      = "2026.02.00"

# Jetpack 组件
lifecycle        = "2.10.0"
navigation       = "2.9.7"
room             = "2.8.4"
datastore        = "1.2.0"

# Hilt
hilt-android     = "2.56"
hilt-androidx    = "1.3.0"

# 测试
junit             = "4.13.2"
androidx-test-ext = "1.3.0"
espresso          = "3.7.0"
coroutines-test   = "1.8.0"
mockito-kotlin    = "5.2.1"

[libraries]
# AndroidX 核心
androidx-core-ktx               = { group = "androidx.core",     name = "core-ktx",               version.ref = "core-ktx" }
androidx-activity-compose       = { group = "androidx.activity", name = "activity-compose",        version.ref = "activity-compose" }

# Compose BOM
androidx-compose-bom             = { group = "androidx.compose",   name = "compose-bom",            version.ref = "compose-bom" }
androidx-compose-ui              = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics     = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling      = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3       = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons  = { group = "androidx.compose.material", name = "material-icons-extended" }

# Lifecycle + ViewModel
androidx-lifecycle-viewmodel-ktx      = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose  = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx        = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",         version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose    = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",     version.ref = "lifecycle" }

# Navigation Compose
androidx-navigation-compose       = { group = "androidx.navigation", name = "navigation-compose",   version.ref = "navigation" }

# Room
androidx-room-runtime             = { group = "androidx.room", name = "room-runtime",               version.ref = "room" }
androidx-room-ktx                 = { group = "androidx.room", name = "room-ktx",                   version.ref = "room" }
androidx-room-compiler            = { group = "androidx.room", name = "room-compiler",              version.ref = "room" }
androidx-room-testing             = { group = "androidx.room", name = "room-testing",               version.ref = "room" }

# DataStore
androidx-datastore-preferences    = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Hilt
hilt-android                      = { group = "com.google.dagger", name = "hilt-android",           version.ref = "hilt-android" }
hilt-android-compiler             = { group = "com.google.dagger", name = "hilt-android-compiler",  version.ref = "hilt-android" }
androidx-hilt-navigation-compose  = { group = "androidx.hilt",     name = "hilt-navigation-compose",version.ref = "hilt-androidx" }

# 测试
junit                             = { group = "junit",             name = "junit",                  version.ref = "junit" }
androidx-test-ext-junit           = { group = "androidx.test.ext", name = "junit",                  version.ref = "androidx-test-ext" }
androidx-espresso-core            = { group = "androidx.test.espresso", name = "espresso-core",     version.ref = "espresso" }
androidx-compose-ui-test-junit4   = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
kotlinx-coroutines-test           = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }
mockito-kotlin                    = { group = "org.mockito.kotlin", name = "mockito-kotlin",        version.ref = "mockito-kotlin" }

[plugins]
android-application  = { id = "com.android.application",          version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android         = { id = "com.google.dagger.hilt.android",   version.ref = "hilt-android" }
ksp                  = { id = "com.google.devtools.ksp",          version.ref = "ksp" }